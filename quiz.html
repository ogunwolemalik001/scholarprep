<!DOCTYPE html>
<html>
<head>
    <title>Mathematics Quiz - ScholarPrep</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>ScholarPrep</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="mathematics.html">Mathematics</a>
        <a href="english.html">English</a>
        <a href="dataprocessing.html">Data Processing</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="quiz.html">Quiz</a>
    </nav>
</header>

<div class="hero">
    <h1>Mathematics Quiz</h1>

    <form id="quizForm">

        <p><b>1. What is 4 + 4?</b></p>
        <input type="radio" name="q1" value="8"> 8<br>
        <input type="radio" name="q1" value="6"> 6<br>
        <input type="radio" name="q1" value="10"> 10<br><br>

        <p><b>2. What is 5 × 3?</b></p>
        <input type="radio" name="q2" value="15"> 15<br>
        <input type="radio" name="q2" value="10"> 10<br>
        <input type="radio" name="q2" value="20"> 20<br><br>

        <p><b>3. What is 12 ÷ 4?</b></p>
        <input type="radio" name="q3" value="3"> 3<br>
        <input type="radio" name="q3" value="2"> 2<br>
        <input type="radio" name="q3" value="6"> 6<br><br>

        <p><b>4. What is 9 + 6?</b></p>
        <input type="radio" name="q4" value="15"> 15<br>
        <input type="radio" name="q4" value="12"> 12<br>
        <input type="radio" name="q4" value="18"> 18<br><br>

        <p><b>5. What is 7 × 2?</b></p>
        <input type="radio" name="q5" value="14"> 14<br>
        <input type="radio" name="q5" value="12"> 12<br>
        <input type="radio" name="q5" value="16"> 16<br><br>

        <button type="button" class="btn" onclick="submitQuiz()">
            Submit Quiz
        </button>

    </form>

    <p id="result"></p>

</div>

<script>
function submitQuiz(){

    let score = 0;

    if(document.querySelector('input[name="q1"]:checked')?.value == "8")
        score++;

    if(document.querySelector('input[name="q2"]:checked')?.value == "15")
        score++;

    if(document.querySelector('input[name="q3"]:checked')?.value == "3")
        score++;

    if(document.querySelector('input[name="q4"]:checked')?.value == "15")
        score++;

    if(document.querySelector('input[name="q5"]:checked')?.value == "14")
        score++;

    let percentage = (score / 5) * 100;

    localStorage.setItem("mathScore", percentage);

    document.getElementById("result").innerHTML =
        "You scored " + percentage + "%";
}
</script>

</body>
</html>
