<div class="hero">

    <h1>Student Dashboard</h1>

    <div class="card">
        <h3>Mathematics Score</h3>
        <p id="score"></p>
    </div>

</div>

<script>
let score = localStorage.getItem("mathScore");

if(score === null){
    document.getElementById("score").innerHTML =
        "No quiz taken yet";
}
else{
    document.getElementById("score").innerHTML =
        "Score: " + score + "%";
}
</script>
